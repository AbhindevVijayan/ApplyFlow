services:
  mysql:
    image: mysql:8.4
    container_name: job-agent-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: job_application_agent
      MYSQL_USER: job_agent
      MYSQL_PASSWORD: job_agent_dev
      MYSQL_ROOT_PASSWORD: root_dev_password

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "job_agent",
          "-pjob_agent_dev"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data: